[server]
bind_addr = "0.0.0.0:8080"
public_url = "https://engine.assay.rs"
allowed_hosts = ["auth.assay.rs", "engine.assay.rs"]

# The engine owns the engine/workflow/auth/vault schemas in whatever
# database this points at. Give it one of its own.
[backend]
type = "postgres"
url = "${DATABASE_URL}"

[workflow]
enabled = true

[auth]
public_url = "https://auth.assay.rs"
admin_api_keys = ["${ADMIN_API_KEY}"]

[auth.session]
ttl_seconds = 2592000

[auth.passkey]
rp_id = "auth.assay.rs"
rp_name = "Assay"

[auth.recovery]
enabled = true
token_ttl_seconds = 900
request_cooldown_seconds = 60

[auth.recovery.smtp]
host = "${SMTP_HOST}"
port = 587
username = "${SMTP_USERNAME}"
password = "${SMTP_PASSWORD}"
from = "Assay <noreply@assay.rs>"
starttls = true

[auth.oidc_provider]
enabled = true
auto_provision = true

[dashboard]
enabled = true
operator_enabled = false
auth_ui_enabled = true

[logging]
level = "info"
format = "json"
