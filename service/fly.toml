app = "assay-auth"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
image = "ghcr.io/developerinlondon/assay-engine:0.5.7"

[experimental]
cmd = ["serve", "--config", "/etc/assay/engine.toml"]

[[files]]
guest_path = "/etc/assay/engine.toml"
local_path = "engine.toml"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 50
hard_limit = 100

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/v1/engine/core/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
