# assay-engine SQLite example config (Phase 3 — workflow + dashboard, no auth)
#
# v0.1.2 changes the SQLite layout from a single file to one file per
# module attached on startup. `data_dir` holds `engine.db`,
# `workflow.db`, and (in v0.14.0) `auth.db`. The directory is created on
# boot if missing.

[server]
bind_addr = "127.0.0.1:3000"

[backend]
type = "sqlite"
# Production deployments override to e.g. /var/lib/assay or a mounted
# volume. As of 0.3.1, env-var substitution (`${VAR}` / `${VAR:-default}`)
# is supported in any string field — `data_dir = "${DATA_DIR:-./data}"`
# lets ops override the path without rewriting the file.
data_dir = "${DATA_DIR:-./data}"

[workflow]
enabled = true

[dashboard]
enabled = true

# The vault module holds every secret under one master key, and that key
# has to be encrypted at rest by something. Without unseal material the
# engine refuses to start rather than write the key beside the secrets it
# protects, where a copy of the store is a copy of the vault.
#
# The default source is the ASSAY_VAULT_SEAL_KEY environment variable, so
# this section can be omitted entirely once that is set. Reading the key
# from a file instead keeps it out of `/proc/<pid>/environ` and out of
# core dumps:
#
# [vault.sealing]
# source = "file"
# path = "/run/secrets/vault-seal-key"   # must be mode 0600
#
# This example is the local-development shape, which logs at ERROR on
# every boot. See docs/vault-sealing.md.
[vault.sealing]
allow_plaintext_kek = true

[logging]
level = "info"
format = "pretty"
