# E2E fixture config for the engine + auth consoles. Used by
# tests-e2e/run.sh to boot the engine; never read in production. Keep
# bind_addr / public_url in lock-step with playwright.config.ts'
# baseURL.

auto_enable_modules = ["auth"]

[server]
bind_addr = "127.0.0.1:8420"
public_url = "http://localhost:8420"

[backend]
type = "sqlite"
data_dir = "/tmp/assay-engine-e2e-data"

[auth]
audience = ["http://localhost:8420"]
admin_api_keys = ["dev-admin-key-change-me"]

[auth.passkey]
rp_id = "localhost"
rp_name = "Assay E2E"

[auth.oidc_provider]
enabled = true

# The vault module is on by default and refuses to boot without unseal
# material, rather than write its master key to the store in the clear.
# This fixture is a throwaway local store, so it takes the documented
# local-development path. A real deployment sets ASSAY_VAULT_SEAL_KEY or
# points `source` at a file — see docs/vault-sealing.md.
[vault.sealing]
allow_plaintext_kek = true

[logging]
level = "info"
format = "pretty"
