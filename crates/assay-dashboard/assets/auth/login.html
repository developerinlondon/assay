<!DOCTYPE html>
<html lang="en" data-default-theme="__BRAND_DEFAULT_THEME__">
<head>
  <script>
    /* Pre-paint theme resolver: saved → default → prefers-color-scheme.
       On any failure (storage disabled, matchMedia absent, sandboxed
       iframe), fall back to `dark` rather than swallowing silently —
       the page never renders untyped. */
    (function () {
      var fallback = 'dark';
      var theme = fallback;
      try {
        var saved = localStorage.getItem('assay-theme');
        var def = (document.documentElement.dataset.defaultTheme || 'auto');
        theme = saved
          || ((def === 'dark' || def === 'light') ? def : null)
          || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_e) {
        theme = fallback;
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · __BRAND_NAME__</title>
  __FAVICON_LINK__
  <link rel="stylesheet" href="/auth/login.css?v=__ASSETV__">
  __ACCENT_STYLE__
  __EXTRA_CSS_LINK__
</head>
<body>
  <main class="login">
    __LOGIN_STORY__
    <section class="login-panel">
      <div class="login-card" aria-labelledby="login-title">
        <header class="login-brand">
          __BRAND_BADGE__
          <h1 class="login-title" id="login-title">Welcome back</h1>
          <p class="login-subtitle">Sign in to continue to __BRAND_NAME__.</p>
        </header>
        <form id="password-login" class="password-login">
          <div class="login-field">
            <label class="login-label" for="email">Email</label>
            <input class="login-input" id="email" name="email" type="email" autocomplete="username" placeholder="Enter your email" required>
          </div>
          <div class="login-field">
            <label class="login-label" for="password">Password</label>
            <div class="login-input-wrap">
              <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="login-reveal" id="password-reveal" type="button" aria-controls="password" aria-pressed="false" title="Show password">
                <span class="login-reveal-label">Show</span>
              </button>
            </div>
            <a class="login-link" href="/auth/recovery">Forgot password?</a>
          </div>
          <p class="login-status login-status-error" id="password-error" role="alert" aria-live="polite"></p>
          <button class="login-submit" id="password-submit" type="submit">Sign in</button>
        </form>
        <section class="upstream-login" id="upstream-login" hidden>
          <div class="login-separator"><span>or</span></div>
          <div class="login-buttons" id="upstreams" aria-live="polite"></div>
        </section>
        <div class="login-status" id="upstream-status" aria-live="polite">
          Loading additional sign-in options&hellip;
        </div>
        <noscript>
          <p class="login-status login-status-error">
            JavaScript is required to sign in.
          </p>
        </noscript>
      </div>
    </section>
  </main>
  <script src="/auth/login.js?v=__ASSETV__"></script>
</body>
</html>
