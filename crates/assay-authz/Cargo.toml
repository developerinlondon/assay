[package]
name = "assay-authz"
version = "0.1.0"
categories = ["authentication", "config", "data-structures"]
edition = "2024"
keywords = ["authorization", "authz", "abac", "policy", "permissions"]
license = "Apache-2.0"
repository = "https://github.com/developerinlondon/assay"
description = "In-process authorization engine: policy statements, grants-at-scope with typed bounds, ABAC conditions, deny-wins, asymmetric fail-closed. Decision-identical to the agentauthz conformance fixtures."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
