name: Deploy flagship engine

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-flagship-engine
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy released engine image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/assay-engine/Cargo.toml | head -1)
          test -n "$version"
          test -f service/engine.toml
          flyctl deploy \
            --config service/fly.toml \
            --image "ghcr.io/developerinlondon/assay-engine:${version}" \
            --ha=false \
            --yes

      - name: Verify public surfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://engine.assay.rs/api/v1/engine/core/health \
            | jq -e '.status == "ok"'
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://auth.assay.rs/auth/.well-known/openid-configuration \
            | jq -e '.issuer == "https://auth.assay.rs/auth"'
