[workspace]
resolver = "2"
members = [
  "crates/assay",
  "crates/assay-auth",
  "crates/assay-authz",
  "crates/assay-dashboard",
  "crates/assay-domain",
  "crates/assay-engine",
  "crates/assay-vault",
  "crates/assay-workflow",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/developerinlondon/assay"

# The workspace links 193 test binaries; at full debuginfo a clean target dir is
# 48 GB, and 22 GB with line tables only. Backtraces still resolve; stepping in a
# debugger needs `CARGO_PROFILE_DEV_DEBUG=2` for that build.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z" # Optimize for size
lto = true # Link-time optimization
codegen-units = 1 # Single codegen unit for better optimization
strip = true # Strip debug symbols
panic = "abort" # Abort on panic (smaller binary)
